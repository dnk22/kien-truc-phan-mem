server {
  listen 3000;
  server_tokens off;
  root /usr/share/nginx/html;
  location = /health/live { access_log off; default_type application/json; return 200 '{"status":"ok","service":"web"}'; }
  location /health/ { proxy_pass http://api-gateway:8080; }
  location /api/ { proxy_pass http://api-gateway:8080; }
  location / { try_files $uri $uri/ /index.html; }
}
